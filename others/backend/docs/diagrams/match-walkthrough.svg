      .ask { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; }
      .bid { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .done { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
    </style>
  </defs>

  <text x="440" y="28" text-anchor="middle" class="t">&#31034;&#20363;&#65306;&#20080;&#21333; 0.3&#65288;&#38480;&#20215; &#8805; 61000&#65289;&#21507; asks</text>

  <text x="120" y="58" text-anchor="middle" class="h">&#21021;&#22987; asks</text>
  <rect x="40" y="68" width="90" height="52" rx="8" class="ask"/>
  <text x="85" y="92" text-anchor="middle" class="p">60000</text>
  <text x="85" y="108" text-anchor="middle" class="p">0.2</text>
  <rect x="150" y="68" width="90" height="52" rx="8" class="ask"/>
  <text x="195" y="92" text-anchor="middle" class="p">61000</text>
  <text x="195" y="108" text-anchor="middle" class="p">0.2</text>
  <line x1="130" y1="94" x2="150" y2="94" stroke="#ef4444" marker-end="url(#a)"/>

  <rect x="300" y="68" width="120" height="52" rx="8" class="bid"/>
