  <text x="360" y="108" text-anchor="middle" class="p">&#25968;&#37327; 0.3</text>
  <line x1="240" y1="94" x2="300" y2="94" stroke="#475569" marker-end="url(#a)"/>

  <rect x="40" y="160" width="240" height="72" rx="8" class="step"/>
  <text x="160" y="184" text-anchor="middle" class="h">&#31532; 1 &#36718;&#25758;&#21512;</text>
  <text x="160" y="204" text-anchor="middle" class="p">min(0.3, 0.2) = 0.2</text>
  <text x="160" y="222" text-anchor="middle" class="p">&#25104;&#20132;&#20215; = maker &#20215; 60000</text>

  <rect x="320" y="160" width="240" height="72" rx="8" class="step"/>
  <text x="440" y="184" text-anchor="middle" class="h">&#31532; 2 &#36718;&#25758;&#21512;</text>
  <text x="440" y="204" text-anchor="middle" class="p">min(0.1, 0.2) = 0.1</text>
  <text x="440" y="222" text-anchor="middle" class="p">&#25104;&#20132;&#20215; = maker &#20215; 61000</text>

  <line x1="360" y1="120" x2="160" y2="160" stroke="#475569" marker-end="url(#a)"/>
  <line x1="360" y1="120" x2="440" y2="160" stroke="#475569" marker-end="url(#a)"/>

  <text x="720" y="58" text-anchor="middle" class="h">&#26368;&#32456;&#29366;&#24577;</text>
  <rect x="620" y="68" width="90" height="52" rx="8" class="ask"/>
  <text x="665" y="92" text-anchor="middle" class="p">61000</text>
  <text x="665" y="108" text-anchor="middle" class="p">&#21097; 0.1</text>
