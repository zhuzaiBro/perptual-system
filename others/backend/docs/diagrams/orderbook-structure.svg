<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 13px; font-weight: 600; fill: #1e293b; }
      .text { font-size: 12px; fill: #334155; }
      .small { font-size: 11px; fill: #64748b; }
      .bid { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .ask { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; }
      .core { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .idx { fill: #fefce8; stroke: #eab308; stroke-width: 2; }
      .level { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .entry { fill: #fdf4ff; stroke: #a855f7; stroke-width: 2; }
    </style>
  </defs>

  <text x="460" y="28" text-anchor="middle" class="title">OrderBook &#20869;&#23384;&#32467;&#26500;&#65288;&#21333;&#21512;&#32422; perp&#65289;</text>

  <!-- root -->
  <rect x="320" y="48" width="280" height="72" rx="8" class="core"/>
  <text x="460" y="72" text-anchor="middle" class="label">OrderBook</text>
  <text x="460" y="92" text-anchor="middle" class="small">Perp &#183; mu(RWMutex)</text>
  <text x="460" y="108" text-anchor="middle" class="small">bids / asks / entries</text>

  <!-- entries -->
  <rect x="660" y="52" width="220" height="64" rx="8" class="idx"/>
  <text x="770" y="76" text-anchor="middle" class="label">entries</text>
  <text x="770" y="96" text-anchor="middle" class="small">map[orderId] &#8594; bookEntry</text>
  <text x="770" y="110" text-anchor="middle" class="small">&#25764;&#21333; / &#25913;&#37327; O(1)</text>
  <line x1="600" y1="84" x2="660" y2="84" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- bids -->
  <rect x="40" y="160" width="380" height="340" rx="10" class="bid"/>
  <text x="230" y="186" text-anchor="middle" class="label">bids &#20080;&#30424; (isBuy=true)</text>
  <text x="230" y="206" text-anchor="middle" class="small">&#20215;&#39640; &#8594; &#20215;&#20302;&#65292;head &#25351;&#26368;&#39640;&#20215;&#26777;</text>

  <rect x="60" y="224" width="150" height="56" rx="8" class="level"/>
  <text x="135" y="248" text-anchor="middle" class="label">levels map</text>
  <text x="135" y="266" text-anchor="middle" class="small">priceKey &#8594; priceLevel</text>

  <rect x="240" y="224" width="150" height="56" rx="8" class="level"/>
  <text x="315" y="248" text-anchor="middle" class="label">head &#38142;&#34920;</text>
  <text x="315" y="266" text-anchor="middle" class="small">&#20215;&#26777;&#21452;&#21521;&#38142;&#34920;</text>

  <rect x="70" y="310" width="100" height="64" rx="8" class="level"/>
  <text x="120" y="334" text-anchor="middle" class="text">60000</text>
  <text x="120" y="352" text-anchor="middle" class="small">totalRem</text>
  <text x="120" y="366" text-anchor="middle" class="small">FIFO queue</text>

  <rect x="190" y="310" width="100" height="64" rx="8" class="level"/>
  <text x="240" y="334" text-anchor="middle" class="text">59000</text>
  <text x="240" y="352" text-anchor="middle" class="small">totalRem</text>
  <text x="240" y="366" text-anchor="middle" class="small">FIFO queue</text>

  <rect x="310" y="310" width="100" height="64" rx="8" class="level"/>
  <text x="360" y="334" text-anchor="middle" class="text">58000</text>
  <text x="360" y="352" text-anchor="middle" class="small">totalRem</text>
  <text x="360" y="366" text-anchor="middle" class="small">FIFO queue</text>

  <line x1="170" y1="342" x2="190" y2="342" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="342" x2="310" y2="342" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="300" text-anchor="middle" class="small" fill="#059669">head</text>

  <rect x="70" y="400" width="340" height="56" rx="8" class="entry"/>
  <text x="240" y="422" text-anchor="middle" class="label">bookEntry&#65288;&#38431;&#21015;&#20803;&#32032;&#65289;</text>
  <text x="240" y="442" text-anchor="middle" class="small">order / remain / price / side / level / elem</text>
  <line x1="120" y1="374" x2="120" y2="400" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="460" y1="120" x2="230" y2="160" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- asks -->
  <rect x="500" y="160" width="380" height="340" rx="10" class="ask"/>
  <text x="690" y="186" text-anchor="middle" class="label">asks &#21334;&#30424; (isBuy=false)</text>
  <text x="690" y="206" text-anchor="middle" class="small">&#20215;&#20302; &#8594; &#20215;&#39640;&#65292;head &#25351;&#26368;&#20302;&#20215;&#26777;</text>

  <rect x="520" y="224" width="150" height="56" rx="8" class="level"/>
  <text x="595" y="248" text-anchor="middle" class="label">levels map</text>
  <text x="595" y="266" text-anchor="middle" class="small">priceKey &#8594; priceLevel</text>

  <rect x="700" y="224" width="150" height="56" rx="8" class="level"/>
  <text x="775" y="248" text-anchor="middle" class="label">head &#38142;&#34920;</text>
  <text x="775" y="266" text-anchor="middle" class="small">&#20215;&#26777;&#21452;&#21521;&#38142;&#34920;</text>

  <rect x="530" y="310" width="100" height="64" rx="8" class="level"/>
  <text x="580" y="334" text-anchor="middle" class="text">61000</text>
  <text x="580" y="352" text-anchor="middle" class="small">totalRem</text>
  <text x="580" y="366" text-anchor="middle" class="small">FIFO queue</text>

  <rect x="650" y="310" width="100" height="64" rx="8" class="level"/>
  <text x="700" y="334" text-anchor="middle" class="text">62000</text>
  <text x="700" y="352" text-anchor="middle" class="small">totalRem</text>
  <text x="700" y="366" text-anchor="middle" class="small">FIFO queue</text>

  <rect x="770" y="310" width="100" height="64" rx="8" class="level"/>
  <text x="820" y="334" text-anchor="middle" class="text">63000</text>
  <text x="820" y="352" text-anchor="middle" class="small">totalRem</text>
  <text x="820" y="366" text-anchor="middle" class="small">FIFO queue</text>

  <line x1="630" y1="342" x2="650" y2="342" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="342" x2="770" y2="342" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="300" text-anchor="middle" class="small" fill="#dc2626">head</text>

  <line x1="460" y1="120" x2="690" y2="160" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="770" y1="116" x2="580" y2="400" stroke="#64748b" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="690" y="392" text-anchor="middle" class="small">entries &#21453;&#21521;&#32034;&#24341;&#27599;&#20010; bookEntry</text>
</svg>
