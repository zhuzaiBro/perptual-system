[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200

# Sepolia / 生产部署：启用 via_ir 以将 MetaNodeDealer 压至 24KB 限制以内
# 使用：FOUNDRY_PROFILE=sepolia forge build / forge script ...
[profile.sepolia]
inherits = "default"
via_ir = true

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[profile.env]
dotenv = ".env"
ffi = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
